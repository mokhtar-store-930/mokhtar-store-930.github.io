function auth(mode){return '<div class="auth">'+head(mode==='up'?'إنشاء حساب جديد':'تسجيل الدخول')+'<div class="box" style="margin-top:-24px;position:relative">'+
 (mode==='up'?'<label class="lbl">الاسم</label><input id="a_name" autocomplete="name"><label class="lbl">رقم الموبايل</label><input id="a_phone" inputmode="tel" autocomplete="tel">':'')+
 '<label class="lbl">الإيميل</label><input id="a_email" type="email" autocomplete="email" dir="ltr"><label class="lbl">كلمة السر</label><input id="a_pass" type="password" autocomplete="'+(mode==='up'?'new-password':'current-password')+'" dir="ltr">'+
 (ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+(ST.msg?'<div class="ok">'+esc(ST.msg)+'</div>':'')+
 '<br><button class="btn" data-a="'+(mode==='up'?'signup':'login')+'" '+(ST.busy?'disabled':'')+'>'+(mode==='up'?'إنشاء الحساب':'دخول')+'</button><div class="hr"></div>'+
 '<button class="btn ghost" data-a="authmode" data-v="'+(mode==='up'?'in':'up')+'">'+(mode==='up'?'عندي حساب بالفعل':'مش عندي حساب، سجّل')+'</button></div></div>'}
function vStmt(){var s=ST.stmt;var bal=s?Number(s.balance):0,lim=s?Number(s.credit_limit):0;
 return head('كشف الحساب')+'<div class="page"><button class="pill" style="background:#0f6b4f;margin-bottom:12px" data-a="tab" data-v="me">رجوع</button><h2>كشف الحساب</h2>'+(!s?'<div class="empty">جاري التحميل...</div>':'<div class="box"><div class="row"><span class="sp">'+(bal>0?'المبلغ المستحق عليك':'رصيدك')+'</span><b class="total" style="color:'+(bal>0?'#b91c1c':'#0b6b43')+'">'+n(Math.abs(bal))+' ج</b></div>'+(lim>0?'<div class="hr"></div><div class="row mut"><span class="sp">حد الائتمان</span><span>'+n(lim)+' ج</span></div><div class="row mut"><span class="sp">المتاح</span><span>'+n(Math.max(0,lim-bal))+' ج</span></div>':'')+'</div>'+((s.rows||[]).map(function(r){var inv=r.type==='invoice';return '<div class="box"><div class="row"><b class="sp">'+(inv?'فاتورة '+esc(r.ref):'دفعة مستلمة')+'</b><b style="color:'+(inv?'#b91c1c':'#0b6b43')+'">'+(inv?'+':'−')+n(r.amount)+' ج</b></div><div class="mut">'+new Date(r.ts).toLocaleDateString('ar-EG',{dateStyle:'medium'})+(inv&&Number(r.paid)>0?' • مدفوع '+n(r.paid)+' ج':'')+'</div></div>'}).join('')||'<div class="empty">مفيش حركات لسه</div>'))+'</div>'}
function vMe(){if(!ST.sess)return auth(ST.view==='up'?'up':'in');var p=ST.prof||{};
 return head('حسابي')+'<div class="page"><h2>بياناتي</h2><div class="box"><label class="lbl" style="margin-top:0">الاسم</label><input id="p_name" value="'+esc(p.name)+'"><label class="lbl">رقم الموبايل</label><input id="p_phone" inputmode="tel" value="'+esc(p.phone)+'"><label class="lbl">عنوان التوصيل</label><textarea id="p_addr" rows="3">'+esc(p.addr)+'</textarea>'+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+'<br><button class="btn" data-a="saveprof">حفظ البيانات</button></div>'+(p.blocked?'<div class="err">حسابك موقوف مؤقتاً، كلم الإدارة</div>':'')+'<button class="btn am" style="margin-bottom:12px" data-a="stmt">كشف الحساب والمديونية</button><div class="box mut">'+esc((ST.sess.user&&ST.sess.user.email)||'')+'</div><button class="btn ghost" data-a="logout">تسجيل الخروج</button></div>'}
function tl(o){var h=o.history||[];var seen={};h.forEach(function(x){seen[x.st]=x.ts});
 if(o.status==='cancelled')return '<div class="err">تم إلغاء الطلب</div>';
 return '<div class="tl">'+STEPS.map(function(s){var d=!!seen[s]||STEPS.indexOf(s)<=STEPS.indexOf(o.status);return '<div class="p '+(d?'done':'')+'"><b>'+LBL[s]+'</b>'+(seen[s]?'<div class="mut">'+new Date(seen[s]).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})+'</div>':'')+'</div>'}).join('')+'</div>'}
function vOrders(){if(!ST.sess)return auth('in');
 var l=ST.orders.map(function(o){var items=(o.items||[]);return '<div class="box"><div class="row"><b class="sp">طلب '+esc(o.id)+'</b><span class="st s-'+o.status+'">'+LBL[o.status]+'</span></div><div class="mut">'+new Date(o.created_at).toLocaleDateString('ar-EG',{dateStyle:'medium'})+' • '+items.length+' صنف • '+(o.pay==='credit'?'آجل':'كاش')+'</div>'+tl(o)+'<div class="hr"></div>'+items.map(function(i){return '<div class="row mut"><span class="sp">'+esc(i.name)+' × '+n(i.q)+' '+(i.u==='c'?'كرتونة':'قطعة')+'</span><span>'+n(i.price*i.q)+' ج</span></div>'}).join('')+'<div class="row" style="margin-top:8px"><span class="sp">الإجمالي</span><b class="total" style="font-size:18px">'+n(o.total)+' ج</b></div></div>'}).join('');
 return head('طلباتي')+'<div class="page"><h2>طلباتي</h2>'+(l||'<div class="empty">لسه معملتش طلبات</div>')+'</div>'}
function vSheet(){if(ST.sheet!=='co')return'';var p=ST.prof||{};
 return '<div class="sheet" data-a="closesheet"><div data-stop="1"><h2 style="margin-top:0">تأكيد الطلب</h2><label class="lbl" style="margin-top:0">الاسم</label><input id="c_name" value="'+esc(p.name)+'"><label class="lbl">الموبايل</label><input id="c_phone" inputmode="tel" value="'+esc(p.phone)+'"><label class="lbl">العنوان</label><textarea id="c_addr" rows="2">'+esc(p.addr)+'</textarea><label class="lbl">طريقة الدفع</label><div class="opts"><button data-a="pay" data-v="cash" class="'+(ST.pay!=='credit'?'on':'')+'">كاش</button><button data-a="pay" data-v="credit" class="'+(ST.pay==='credit'?'on':'')+'">آجل (بموافقة)</button></div><div class="hr"></div><div class="row"><span class="sp">الإجمالي</span><span class="total">'+n(cartTotal())+' ج</span></div>'+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+'<br><button class="btn am" data-a="place" '+(ST.busy?'disabled':'')+'>'+(ST.busy?'جاري الإرسال...':'أرسل الطلب')+'</button></div></div>'}
function render(){var keep=document.activeElement;var v=ST.tab==='stmt'?vStmt():ST.tab==='cart'?vCart():ST.tab==='orders'?vOrders():ST.tab==='me'?vMe():vHome();
 var tabs=[['home','الرئيسية','home'],['cart','السلة','cart'],['orders','طلباتي','box'],['me','حسابي','user']];
 var root=$('.app');var focusId=R.activeElement&&R.activeElement.id,pos=null;try{pos=R.activeElement.selectionStart}catch(e){}
 root.innerHTML=v+vSheet()+'<div class="tabbar">'+tabs.map(function(t){return '<button class="'+(ST.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+ic(t[2])+t[1]+(t[0]==='cart'&&cartCount()?'<span class="badge">'+cartCount()+'</span>':'')+'</button>'}).join('')+'</div>';
 if(focusId){var e=$('#'+focusId);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}}
function go(t){ST.tab=t;ST.err='';ST.msg='';render();if(t==='orders')loadOrders().then(render);if(t==='me'&&ST.sess)loadMe().then(render);try{window.scrollTo(0,0)}catch(e){}}
function val(id){var e=$('#'+id);return e?e.value.trim():''}
function afterAuth(s,name,phone){saveSess(s);return loadMe().then(function(){if(!ST.prof&&(name||phone))return api('/rest/v1/customer_profiles',{method:'POST',body:{id:s.user.id,name:name||'',phone:phone||''},prefer:'resolution=merge-duplicates,return=representation'}).then(function(r){ST.prof=r&&r[0]||{name:name,phone:phone,addr:''}});if(!ST.prof)return api('/rest/v1/customer_profiles',{method:'POST',body:{id:s.user.id},prefer:'resolution=merge-duplicates,return=representation'}).then(function(r){ST.prof=r&&r[0]||{}})}).then(function(){ST.busy=false;ST.err='';go(ST.after||'home');ST.after=null})}
var A={
 tab:function(d){go(d.v)},stmt:function(){ST.stmt=null;ST.tab='stmt';render();rpc('my_statement').then(function(r){ST.stmt=r||{balance:0,rows:[]};render()}).catch(function(e){ST.stmt={balance:0,rows:[]};ST.err=tr(e.message);render()})},bn:function(d){if(d.url){window.open(d.url,'_blank')}else if(d.cat){ST.cat=d.cat;render()}},cat:function(d){ST.cat=d.v;render()},unit:function(d){ST.unit[d.p]=d.u;render()},reload:function(){ST.loadErr='';ST.loaded=false;render();loadCatalog().then(render)},
 q:function(d){setQ(Number(d.p),d.u,Number(d.d))},authmode:function(d){ST.view=d.v;ST.err='';ST.msg='';render()},
 login:function(){var e=val('a_email'),p=$('#a_pass').value;if(!e||!p){ST.err='اكتب الإيميل وكلمة السر';return render()}ST.busy=true;ST.err='';render();
  api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:e,password:p},anon:true}).then(function(s){return afterAuth(s)}).catch(function(x){ST.busy=false;ST.err=tr(x.message);render()})},
 signup:function(){var nm=val('a_name'),ph=val('a_phone'),e=val('a_email'),p=$('#a_pass').value;if(!nm||!ph||!e||p.length<6){ST.err='كمّل كل البيانات (كلمة السر ٦ حروف على الأقل)';return render()}ST.busy=true;ST.err='';render();
  api('/auth/v1/signup',{method:'POST',body:{email:e,password:p,data:{name:nm,phone:ph}},anon:true}).then(function(s){
   if(s&&s.access_token)return afterAuth(s,nm,ph);ST.busy=false;ST.msg='تم إنشاء الحساب. افتح الإيميل وأكّد الحساب، وبعدها سجّل دخول.';ST.view='in';render()}).catch(function(x){ST.busy=false;ST.err=tr(x.message);render()})},
 logout:function(){saveSess(null);ST.prof=null;ST.orders=[];render();go('home')},
 saveprof:function(){var b={id:ST.sess.user.id,name:val('p_name'),phone:val('p_phone'),addr:val('p_addr')};api('/rest/v1/customer_profiles',{method:'POST',body:b,prefer:'resolution=merge-duplicates,return=representation'}).then(function(r){ST.prof=r&&r[0]||b;ST.err='';render();toast('تم حفظ بياناتك')}).catch(function(x){ST.err=tr(x.message);render()})},
 checkout:function(){if(ST.prof&&ST.prof.blocked){ST.err='حسابك موقوف';return render()}if(!ST.sess){ST.after='cart';ST.view='in';ST.msg='سجّل دخول عشان تكمل الطلب';return go('me')}ST.sheet='co';ST.err='';render()},
 closesheet:function(d,ev){if(ev.target.getAttribute('data-a')==='closesheet'){ST.sheet=null;render()}},
 pay:function(d){ST.pay=d.v;var nm=val('c_name'),ph=val('c_phone'),ad=val('c_addr');ST.prof=Object.assign({},ST.prof,{name:nm,phone:ph,addr:ad});render()},
 place:function(){var nm=val('c_name'),ph=val('c_phone'),ad=val('c_addr');if(!nm||!ph||!ad){ST.err='اكتب الاسم والموبايل والعنوان';return render()}ST.busy=true;ST.err='';ST.prof=Object.assign({},ST.prof,{name:nm,phone:ph,addr:ad});render();
  api('/rest/v1/rpc/place_order',{method:'POST',body:{p_name:nm,p_phone:ph,p_addr:ad,p_pay:ST.pay||'cash',p_items:ST.cart.map(function(c){return{pid:c.pid,u:c.u,q:c.q}})}}).then(function(r){
   ST.cart=[];saveCart();ST.sheet=null;ST.busy=false;api('/rest/v1/customer_profiles',{method:'POST',body:{id:ST.sess.user.id,name:nm,phone:ph,addr:ad},prefer:'resolution=merge-duplicates'}).catch(function(){});
   toast('تم إرسال الطلب '+(r&&r.id||''));go('orders')}).catch(function(x){ST.busy=false;ST.err=tr(x.message);render()})}
};
function rpc(f,b){return api('/rest/v1/rpc/'+f,{method:'POST',body:b||{}})}
var root=$('.app');
root.addEventListener('click',function(ev){var t=ev.target;while(t&&t!==root&&!(t.getAttribute&&t.getAttribute('data-a')))t=t.parentNode;if(!t||t===root)return;
 if(t.getAttribute('data-a')==='closesheet'&&ev.target!==t)return;var d={};for(var i=0;i<t.attributes.length;i++){var a=t.attributes[i];if(a.name.indexOf('data-')===0)d[a.name.slice(5)]=a.value}
 var f=A[d.a];if(f)f(d,ev)});
root.addEventListener('input',function(ev){if(ev.target.id==='q'){ST.q=ev.target.value;var p=ev.target.selectionStart;render()}});
setInterval(function(){if(ST.tab==='orders'&&ST.sess&&!document.hidden)loadOrders().then(function(){if(ST.tab==='orders'&&!(R.activeElement&&R.activeElement.id))render()})},12000);
render();refresh().then(function(){return Promise.all([loadCatalog(),loadMe()])}).then(render);
window.__MKREADY=1;
})();
</script></body></html>
