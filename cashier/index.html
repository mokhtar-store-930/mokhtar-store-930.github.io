var SC={stream:null,raf:0,on:false,det:null};
function scStop(){SC.on=false;if(SC.raf)cancelAnimationFrame(SC.raf);SC.raf=0;if(SC.stream){SC.stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});SC.stream=null}var o=document.getElementById('sc_ov');if(o)o.parentNode.removeChild(o)}
function scCode(txt){var m=String(txt||'').match(/lc=([0-9A-Za-z]{8,32})/);if(m)return m[1];var t=String(txt||'').trim();return /^[0-9A-Za-z]{8,32}$/.test(t)?t:null}
function scMsg(t){var e=document.getElementById('sc_msg');if(e)e.textContent=t}
function scFail(t){scStop();ST.err=t;ST.lm='code';render()}
A.scanqr=function(){
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){return scFail(window.isSecureContext===false?'الكاميرا بتشتغل بس على رابط آمن (https). اكتب الكود يدويًا.':'المتصفح ده مش بيدعم الكاميرا. اكتب الكود يدويًا.')}
 scStop();var o=document.createElement('div');o.id='sc_ov';o.style.cssText='position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center';
 o.innerHTML='<video id="sc_v" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0"></video><div style="position:absolute;top:50%;left:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border:3px solid #ffb938;border-radius:20px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)"></div><div id="sc_msg" style="position:absolute;bottom:110px;left:16px;right:16px;text-align:center;color:#fff;font-weight:700;font-size:15px">وجّه الكاميرا على الـ QR</div><button id="sc_x" style="position:absolute;bottom:40px;padding:14px 34px;border-radius:30px;border:0;background:#fff;font-weight:800;font-size:16px;font-family:inherit">إغلاق</button>';
 document.body.appendChild(o);document.getElementById('sc_x').onclick=scStop;SC.on=true;
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
  if(!SC.on){s.getTracks().forEach(function(t){t.stop()});return}
  SC.stream=s;var v=document.getElementById('sc_v');v.srcObject=s;var pl=v.play();if(pl&&pl.catch)pl.catch(function(){});
  var det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}
  var cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),busy=false,last=0;
  function done(txt){var c=scCode(txt);if(!c){scMsg('ده مش كود دخول صالح، جرّب تاني');return false}scStop();lcLogin(c);return true}
  function tick(ts){if(!SC.on)return;SC.raf=requestAnimationFrame(tick);if(busy||ts-last<150||v.readyState<2||!v.videoWidth)return;last=ts;busy=true;
   if(det){det.detect(v).then(function(r){busy=false;if(r&&r.length)done(r[0].rawValue)}).catch(function(){busy=false;det=null})}
   else if(typeof jsQR==='function'){var w=v.videoWidth,h=v.videoHeight,k=Math.min(1,640/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);cx.drawImage(v,0,0,cv.width,cv.height);var im=cx.getImageData(0,0,cv.width,cv.height);var q=jsQR(im.data,cv.width,cv.height,{inversionAttempts:'dontInvert'});busy=false;if(q&&q.data)done(q.data)}
   else{busy=false;scFail('مفيش قارئ QR متاح. اكتب الكود يدويًا.')}}
  SC.raf=requestAnimationFrame(tick)
 }).catch(function(e){var n=e&&e.name||'';scFail(n==='NotAllowedError'||n==='SecurityError'?'مسموحش بالكاميرا. فعّل إذن الكاميرا من إعدادات المتصفح أو اكتب الكود يدويًا.':n==='NotFoundError'||n==='OverconstrainedError'?'مفيش كاميرا على الجهاز ده. اكتب الكود يدويًا.':'تعذّر تشغيل الكاميرا. اكتب الكود يدويًا.')})};

var HP={q:'',open:null,rows:null,tried:false,DEF:[{"aud": "customer", "q": "إزاي أعمل حساب جديد؟", "steps": "افتح التطبيق واضغط على أيقونة الحساب أو «تسجيل الدخول».\nاختار تبويب «حساب جديد».\nاكتب اسمك واسم المحل، واختار المحافظة ثم المنطقة.\nاكتب العنوان بالتفصيل (الشارع وعلامة مميزة). العنوان مطلوب.\nاختار نشاط المحل (سوبر ماركت، بقالة، مطعم...).\nاختياري: اضغط «حدد موقع المحل على الخريطة» وحرّك الخريطة لحد ما الدبوس يبقى على محلك، وبعدين «تأكيد الموقع».\nاكتب رقم موبايلك وكلمة سر ٦ أحرف على الأقل، واضغط «إنشاء الحساب والمتابعة».\nملحوظة: التسجيل للمحلات فقط حاليًا.", "sort": 1}, {"aud": "customer", "q": "إزاي أسجّل دخول؟", "steps": "اضغط «تسجيل الدخول».\nاكتب رقم موبايلك اللي سجلت بيه وكلمة السر.\nاضغط «تسجيل الدخول».\nتقدر تضغط على أيقونة العين عشان تشوف كلمة السر وأنت بتكتبها.", "sort": 2}, {"aud": "customer", "q": "نسيت كلمة السر، أعمل إيه؟", "steps": "في شاشة الدخول اضغط «نسيت كلمة المرور؟».\nهيفتحلك واتساب برسالة جاهزة لخدمة العملاء (أو اتصال لو واتساب مش متاح).\nابعت الرسالة، والإدارة هتعيّنلك كلمة سر جديدة وتبلغك بيها.\nبعد ما تدخل غيّرها من «حسابي» لكلمة تفتكرها.", "sort": 3}, {"aud": "customer", "q": "إزاي أدور على منتج؟", "steps": "من الرئيسية اكتب اسم المنتج في خانة البحث فوق.\nتقدر تكتب جزء من الاسم أو رقم الباركود.\nأو اضغط على أيقونة الكاميرا جنب خانة البحث ووجّه الكاميرا ناحية باركود المنتج وهيظهرلك.\nتقدر كمان تتصفح من «الأقسام» وتختار القسم.", "sort": 4}, {"aud": "customer", "q": "إزاي أضيف منتج للسلة؟", "steps": "افتح المنتج أو اضغط زر الإضافة على كارت المنتج.\nاختار تشتري «قطعة» ولا «كرتونة» (سعر الجملة بيختلف).\nحدد الكمية بالزر + و −.\nاضغط «أضف للسلة»، وهيظهر عدد الأصناف على أيقونة السلة.", "sort": 5}, {"aud": "customer", "q": "إزاي أكمل الطلب؟", "steps": "اضغط على أيقونة «السلة» وراجع الأصناف والكميات والإجمالي.\nلو عندك كوبون خصم اكتبه واضغط تطبيق.\nراجع عنوان التوصيل (بيتحط تلقائي العنوان الرئيسي اللي سجلته).\nاختار طريقة الدفع (كاش أو آجل لو حسابك مسموحله).\nاضغط «تأكيد الطلب». هتلاقي رقم الطلب وهتقدر تتابعه من «طلباتي».", "sort": 6}, {"   return '<div class="hpi'+(op?' on':'')+'"><button type="button" class="hpq" data-a="hpopen" data-id="'+esc(id)+'"><span>'+esc(r.q)+'</span><i>'+(op?'−':'+')+'</i></button>'+(op?'<ol class="hps">'+st.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>':'')+'</div>'}).join('')}
