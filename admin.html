 var form=e?'<div class="sheet" data-a="closecu"><div><h2 style="margin-top:0">حساب العميل</h2><label class="lbl" style="margin-top:0">الاسم</label><input id="u_name" value="'+esc(e.name)+'"><label class="lbl">الموبايل</label><input id="u_phone" value="'+esc(e.phone)+'"><label class="lbl">العنوان</label><input id="u_addr" value="'+esc(e.addr)+'"><label class="lbl">حد الائتمان (٠ = كاش فقط)</label><input id="u_lim" inputmode="decimal" value="'+(e.credit_limit||0)+'"><label class="lbl">ملاحظات</label><input id="u_notes" value="'+esc(e.notes||'')+'"><label class="lbl"><input type="checkbox" id="u_blk" style="width:auto" '+(e.blocked?'checked':'')+'> إيقاف الحساب (منع الطلبات)</label>'+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+'<br><button class="btn" data-a="savecu">حفظ</button>'+(has('accounts')&&e.ledger_id?'<div class="hr"></div><label class="lbl" style="margin-top:0">تسجيل دفعة مستلمة من العميل</label><input id="u_pay" inputmode="decimal" placeholder="المبلغ"><br><br><button class="btn am" data-a="collect">تسجيل الدفعة</button>':'')+'</div></div>':'';
 return '<div class="page"><div class="box"><div class="row"><span class="sp">إجمالي ديون العملاء</span><b class="total">'+n(debt)+' ج</b></div></div><h2>حسابات العملاء ('+ST.cacc.length+')</h2>'+(ST.cacc.map(function(c){var l=ledger(c);return '<div class="box" data-a="editcu" data-id="'+c.id+'"><div class="row"><b class="sp">'+esc(c.name||'بدون اسم')+'</b>'+(c.blocked?'<span class="st s-cancelled">موقوف</span>':'')+(l?'<b style="color:'+(l.balance>0?'#b91c1c':'#0b6b43')+'">'+n(l.balance)+' ج</b>':'')+'</div><div class="mut">'+esc(c.phone)+' • '+esc(c.addr)+(c.credit_limit>0?' • حد '+n(c.credit_limit):'')+'</div></div>'}).join('')||'<div class="empty">لسه مفيش عملاء سجلوا</div>')+form+'</div>'}
function vBan(){var e=ST.ebn;var form=e?'<div class="sheet" data-a="closeban"><div><h2 style="margin-top:0">'+(e.id?'تعديل بانر':'بانر جديد')+'</h2><label class="lbl" style="margin-top:0">العنوان</label><input id="b_title" value="'+esc(e.title)+'"><label class="lbl">سطر فرعي</label><input id="b_sub" value="'+esc(e.sub)+'"><label class="lbl">رابط الصورة (اختياري)</label><input id="b_img" dir="ltr" value="'+esc(e.image_url)+'"><label class="lbl">لون الخلفية (لو مفيش صورة)</label><input id="b_color" dir="ltr" value="'+esc(e.color)+'"><label class="lbl">يفتح قسم (اسم القسم)</label><input id="b_cat" value="'+esc(e.link_cat)+'"><label class="lbl">أو يفتح رابط</label><input id="b_url" dir="ltr" value="'+esc(e.link_url)+'"><label class="lbl">الترتيب</label><input id="b_sort" inputmode="numeric" value="'+(e.sort||0)+'"><label class="lbl"><input type="checkbox" id="b_act" style="width:auto" '+(e.active?'checked':'')+'> ظاهر للعملاء</label>'+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+'<br><button class="btn" data-a="saveban">حفظ</button>'+(e.id?'<br><button class="btn ghost" data-a="delban">حذف</button>':'')+'</div></div>':'';
 return '<div class="page"><button class="btn am" data-a="newban">+ بانر جديد</button><br>'+(ST.banners.map(function(b){return '<div class="box" data-a="editban" data-id="'+b.id+'"><div class="row"><div style="width:54px;height:36px;border-radius:9px;background:'+(b.image_url?'url('+esc(b.image_url)+') center/cover':esc(b.color))+'"></div><b class="sp">'+esc(b.title)+'</b>'+(b.active?'':'<span class="st s-cancelled">مخفي</span>')+'</div><div class="mut">'+esc(b.sub)+'</div></div>'}).join('')||'<div class="empty">مفيش بانرات. البانر بيظهر أعلى صفحة العميل.</div>')+form+'</div>'}
function vRep(){return '<div class="page"><h2>الفريق</h2><div class="box"><div class="mut">أنشئ المستخدم أولاً من Supabase (Authentication > Users > Add user) ثم اكتب إيميله هنا واختار النوع.</div><label class="lbl">الإيميل</label><input id="r_email" dir="ltr"><label class="lbl">الاسم</label><input id="r_name"><label class="lbl">الموبايل</label><input id="r_phone" inputmode="tel"><label class="lbl">النوع</label><div class="opts"><button data-a="rrole" data-v="rep" class="'+(ST.rrole!=='manager'?'on':'')+'">مندوب</button><button data-a="rrole" data-v="manager" class="'+(ST.rrole==='manager'?'on':'')+'">مدير بصلاحيات</button></div>'+(ST.rrole==='manager'?'<label class="lbl">الصلاحيات</label>'+Object.keys(PERMS).map(function(k){return '<label style="display:block;margin:6px 0"><input type="checkbox" class="pm" value="'+k+'" style="width:auto"> '+PERMS[k]+'</label>'}).join(''):'<label class="lbl">نسبة العمولة %</label><input id="r_comm" inputmode="decimal" value="0">')+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+'<br><button class="btn" data-a="addrep">إضافة</button></div>'+ST.reps.map(function(r){var d=ST.orders.filter(function(o){return o.rep_id===r.id&&o.status==='delivered'});var tot=d.reduce(function(t,o){return t+Number(o.total)},0);return '<div class="box"><div class="row"><b class="sp">'+esc(r.name)+'</b><span class="st '+(r.active?'s-delivered':'s-cancelled')+'">'+(r.role==='rep'?'مندوب':'مدير')+(r.active?'':' (موقوف)')+'</span></div><div class="mut">'+esc(r.phone)+'</div>'+(r.role==='rep'?'<div class="mut">سلّم '+d.length+' طلب بإجمالي '+n(tot)+' ج • عمولة '+n(tot*r.commission/100)+' ج</div>':'<div class="mut">'+(r.perms||[]).map(function(k){return PERMS[k]}).join('، ')+'</div>')+'<button class="btn ghost" style="margin-top:8px" data-a="tgl" data-id="'+r.id+'" data-v="'+(r.active?'0':'1')+'">'+(r.active?'إيقاف الحساب':'تفعيل الحساب')+'</button></div>'}).join('')+'<div class="box mut">لينك دخول المناديب: rep.html في نفس موقعك.</div></div>'}
function vRpt(){var d=ST.orders.filter(function(o){return o.status==='delivered'});var tot=d.reduce(function(t,o){return t+Number(o.total)},0);var cr=d.filter(function(o){return o.pay==='credit'}).reduce(function(t,o){return t+Number(o.total)},0);var by={};d.forEach(function(o){(o.items||[]).forEach(function(i){by[i.name]=(by[i.name]||0)+i.price*i.q})});
 var top=Object.keys(by).sort(function(a,b){return by[b]-by[a]}).slice(0,8);var low=ST.prods.filter(function(p){return p.stock<=p.min_stock});
 return '<div class="page"><h2>التقارير</h2><div class="box"><div class="row"><span class="sp">طلبات مسلّمة</span><b>'+d.length+'</b></div><div class="row"><span class="sp">إجمالي المبيعات المسلّمة</span><b>'+n(tot)+' ج</b></div><div class="row"><span class="sp">منها آجل</span><b>'+n(cr)+' ج</b></div></div><div class="box"><b>الأكثر مبيعاً</b><div class="hr"></div>'+(top.map(function(k){return '<div class="row"><span class="sp">'+esc(k)+'</span><span>'+n(by[k])+' ج</span></div>'}).join('')||'<span class="mut">لسه مفيش بيانات</span>')+'</div><div class="box"><b>أصناف قربت تخلص</b><div class="hr"></div>'+(low.map(function(p){return '<div class="row"><span class="sp">'+esc(p.name)+'</span><span>'+n(p.stock)+'</span></div>'}).join('')||'<span class="mut">كله تمام</span>')+'</div></div>'}
function render(){var root=$('.app');var fid=R.activeElement&&R.activeElement.id,pos=null;try{pos=R.activeElement.selectionStart}catch(e){}var h;
 if(!ST.sess)h=vLogin();else if(!ST.role)h=MODE==='rep'?vWrong():vClaim();else if((MODE==='rep')!==(ST.role==='rep'))h=vWrong();else{var tabs=ST.role==='rep'?[['ord','طلباتي']]:[has('orders')?['ord','الطلبات']:0,has('products')||has('inventory')?['prod','المنتجات']:0,has('banners')?['ban','البنرات']:0,has('customers')||has('accounts')?['cust','العملاء']:0,ST.role==='admin'?['rep','الفريق']:0,has('orders')||has('accounts')?['rpt','التقارير']:0].filter(Boolean);
  if(!tabs.some(function(t){return t[0]===ST.tab}))ST.tab=tabs[0]?tabs[0][0]:'ord';
  var body=ST.tab==='prod'?vProd():ST.tab==='cust'?vCust():ST.tab==='ban'?vBan():ST.tab==='rep'?vRep():ST.tab==='rpt'?vRpt():vOrd();
  h=head(ST.role==='rep'?'لوحة المندوب':ST.role==='manager'?'لوحة المدير':'لوحة الإدارة')+'<div class="chips" style="padding-bottom:0">'+tabs.map(function(t){return '<button class="chip '+(ST.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'<button class="chip" data-a="reload">تحديث</button></div>'+body}
 root.style.paddingBottom='20px';root.innerHTML=h;if(fid){var e=$('#'+fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}}
function val(id){var e=$('#'+id);return e?e.value.trim():''}
function done(msg){ST.err='';return loadAll().then(function(){render();if(msg)toast(msg)})}
function fail(x){ST.err=tr(x.message);ST.busy=false;render()}
function has(p){return ST.role==='admin'||(ST.role==='manager'&&(ST.prof.perms||[]).indexOf(p)>=0)}
var A={tab:function(d){ST.tab=d.v;ST.err='';ST.edit=null;render()},filt:function(d){ST.filt=d.v;render()},reload:function(){loadAll().then(function(){render();toast('تم التحديث')})},
 logout:function(){saveSess(null);ST.role=null;render()},
 login:function(){var e=val('a_email'),p=$('#a_pass').value;ST.err='';api('/auth/v1/token?grant_type=password',{method:'POST',body:{email:e,password:p},anon:true}).then(function(s){saveSess(s);return loadRole().then(loadAll)}).then(render).catch(fail)},
 claim:function(){rpc('claim_admin').then(function(ok){if(!ok){ST.adminExists=true;ST.err='فيه مدير بالفعل'}return loadRole().then(loadAll)}).then(render).catch(fail)},
 st:function(d){rpc('admin_set_order',{p_id:d.id,p_status:d.v}).then(function(){return done('تم')}).catch(fail)},
 assign:function(d){var r=val('rep_'+d.id);if(!r){ST.err='اختار مندوب';return render()}rpc('admin_set_order',{p_id:d.id,p_status:'assigned',p_rep:r}).then(function(){return done('تم التعيين')}).catch(fail)},
 deliver:function(d){rpc('rep_set_status',{p_id:d.id,p_status:'delivered'}).then(function(){return done('تم التسليم')}).catch(fail)},
 newprod:function(){ST.edit={name:'',cat:'عام',piece_price:'',carton_price:'',per:1,cost:'',min_stock:0};ST.err='';render()},
 editprod:function(d){ST.edit=ST.prods.filter(function(p){return String(p.id)===d.id})[0];ST.err='';render()},
 closeedit:function(d,ev){if(ev.target.getAttribute('data-a')==='closeedit'){ST.edit=null;render()}},
 saveprod:function(){var p=ST.edit,b={name:val('e_name'),cat:val('e_cat')||'عام',piece_price:+val('e_pp')||0,carton_price:+val('e_cp')||0,per:Math.max(1,parseInt(val('e_per'))||1),cost:+val('e_cost')||0,min_stock:parseInt(val('e_min'))||0,image_url:val('e_img'),featured:!!$('#e_feat').checked};if(!b.name){ST.err='اكتب اسم الصنف';return render()}
  var go=p.id?api('/rest/v1/products?id=eq.'+p.id,{method:'PATCH',body:b}).then(function(){var adj=parseInt(val('e_adj'));return adj?rpc('stock_adjust',{p_pid:p.id,p_delta:adj,p_type:'adjustment',p_note:'تعديل يدوي'}):0}):api('/rest/v1/products',{method:'POST',body:Object.assign(b,{stock:parseInt(val('e_stock'))||0})});
  go.then(function(){ST.edit=null;return done('تم الحفظ')}).catch(fail)},
 rrole:function(d){ST.rrole=d.v;render()},
 tgl:function(d){rpc('admin_set_staff_active',{p_id:d.id,p_active:d.v==='1'}).then(function(){return done('تم')}).catch(fail)},
 newban:function(){ST.ebn={title:'',sub:'',image_url:'',color:'#0f6b4f',link_cat:'',link_url:'',sort:0,active:true};ST.err='';render()},editban:function(d){ST.ebn=ST.banners.filter(function(b){return String(b.id)===d.id})[0];ST.err='';render()},closeban:function(d,ev){if(ev.target.getAttribute('data-a')==='closeban'){ST.ebn=null;render()}},
 saveban:function(){var b=ST.ebn,v={title:val('b_title'),sub:val('b_sub'),image_url:val('b_img'),color:val('b_color')||'#0f6b4f',link_cat:val('b_cat'),link_url:val('b_url'),sort:parseInt(val('b_sort'))||0,active:!!$('#b_act').checked};if(!v.title){ST.err='اكتب عنوان';return render()}(b.id?api('/rest/v1/banners?id=eq.'+b.id,{method:'PATCH',body:v}):api('/rest/v1/banners',{method:'POST',body:v})).then(function(){ST.ebn=null;return done('تم الحفظ')}).catch(fail)},
 delban:function(){api('/rest/v1/banners?id=eq.'+ST.ebn.id,{method:'DELETE'}).then(function(){ST.ebn=null;return done('تم الحذف')}).catch(fail)},
 editcu:function(d){ST.ecu=ST.cacc.filter(function(c){return c.id===d.id})[0];ST.err='';render()},closecu:function(d,ev){if(ev.target.getAttribute('data-a')==='closecu'){ST.ecu=null;render()}},
 savecu:function(){rpc('admin_set_customer',{p_id:ST.ecu.id,p_blocked:!!$('#u_blk').checked,p_limit:+val('u_lim')||0,p_name:val('u_name'),p_phone:val('u_phone'),p_addr:val('u_addr'),p_notes:val('u_notes')}).then(function(){ST.ecu=null;return done('تم الحفظ')}).catch(fail)},
 collect:function(){rpc('admin_collect',{p_id:ST.ecu.id,p_amount:+val('u_pay')||0,p_note:'تحصيل'}).then(function(){ST.ecu=null;return done('تم تسجيل الدفعة')}).catch(fail)},
 addrep:function(){var role=ST.rrole==='manager'?'manager':'rep';var perms=[].slice.call(R.querySelectorAll('.pm')).filter(function(x){return x.checked}).map(function(x){return x.value});rpc('admin_add_staff',{p_email:val('r_email'),p_name:val('r_name'),p_phone:val('r_phone'),p_role:role,p_commission:role==='rep'?(+val('r_comm')||0):0,p_perms:perms}).then(function(){return done('تمت إضافة المندوب')}).catch(fail)}};
var root=$('.app');
root.addEventListener('click',function(ev){var t=ev.target;while(t&&t!==root&&!(t.getAttribute&&t.getAttribute('data-a')))t=t.parentNode;if(!t||t===root)return;
 if(/^close/.test(t.getAttribute('data-a'))&&ev.target!==t)return;var d={};for(var i=0;i<t.attributes.length;i++){var a=t.attributes[i];if(a.name.indexOf('data-')===0)d[a.name.slice(5)]=a.value}var f=A[d.a];if(f)f(d,ev)});
root.addEventListener('input',function(ev){if(ev.target.id==='pq'){ST.q=ev.target.value;render()}});
setInterval(function(){if(ST.sess&&ST.role&&!document.hidden&&!ST.edit&&!ST.ebn&&!ST.ecu&&!(R.activeElement&&R.activeElement.id)){api('/rest/v1/orders?select=*&order=created_at.desc&limit=100').then(function(r){var k=ST.orders.length+(ST.orders[0]&&ST.orders[0].updated_at);if(r&&(r.length+(r[0]&&r[0].updated_at))!==k){ST.orders=r;render()}}).catch(function(){})}},10000);
render();boot().then(render);window.__MKREADY=1;
})();
</script></body></html>
