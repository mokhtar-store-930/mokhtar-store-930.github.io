        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

 qrurl:function(){var v=val('repurl');if(v)store.set('mk_repurl',v);render()},

 ublk:function(){var e=ST.eu,b=!(e.banned||!e.active);rpc('admin_user_set_blocked',{p_id:e.id,p_blocked:b}).then(function(){ST.eu=null;toast(b?'تم الحظر':'تم إلغاء الحظر');return loadUsers()}).catch(fail)},

function vCoup(){var l=ST.coupons||[],e=ST.ecp;
 var form=e?'<div class="sheet" data-a="closecp"><div data-stop="1"><h2 style="margin-top:0">'+(e.id?'تعديل كوبون':'كوبون جديد')+'</h2><label class="lbl" style="margin-top:0">الكود</label><input id="k_code" dir="ltr" value="'+esc(e.code)+'" '+(e.id?'readonly':'')+'><label class="lbl">نوع الخصم</label><div class="opts"><button data-a="kkind" data-v="pct" class="'+(e.kind==='pct'?'on':'')+'">نسبة %</button><button data-a="kkind" data-v="fixed" class="'+(e.kind==='fixed'?'on':'')+'">مبلغ ثابت</button></div><label class="lbl">القيمة ('+(e.kind==='pct'?'%':'جنيه')+')</label><input id="k_val" inputmode="decimal" value="'+(e.value||'')+'"><label class="lbl">أقل قيمة للطلب</label><input id="k_min" inputmode="decimal" value="'+(e.min_order||0)+'"><label class="lbl">أقصى عدد استخدامات (فاضي = بلا حد)</label><input id="k_max" inputmode="numeric" value="'+(e.max_uses==null?'':e.max_uses)+'"><label class="lbl">ينتهي في (اختياري)</label><input id="k_exp" type="date" value="'+(e.expires_at?String(e.expires_at).slice(0,10):'')+'"><label class="lbl"><input type="checkbox" id="k_once" style="width:auto" '+(e.once_per_customer?'checked':'')+'> مرة واحدة لكل عميل</label><label class="lbl"><input type="checkbox" id="k_act" style="width:auto" '+(e.active?'checked':'')+'> مفعّل</label>'+(ST.err?'<div class="err">'+esc(ST.err)+'</div>':'')+'<br><button class="btn" data-a="kcsave">حفظ</button>'+(e.id?'<br><button class="btn ghost" style="color:#c0262d;border-color:#c0262d" data-a="kcdel">حذف</button>':'')+'</div></div>':'';
 return '<div class="page"><div class="row"><h2 class="sp" style="margin:0">الكوبونات</h2><button class="btn am" style="width:auto;padding:12px 16px" data-a="kcnew">+ كوبون</button></div><div style="height:10px"></div>'+(l.map(function(c){return '<div class="box" data-a="kcedit" data-id="'+c.id+'"><div class="row"><b class="sp" dir="ltr" style="text-align:right">'+esc(c.code)+'</b>'+(c.active?'':'<span class="st s-cancelled">متوقف</span>')+'<b>'+(c.kind==='pct'?n(c.value)+'%':n(c.value)+' ج')+'</b></div><div class="mut">استُخدم '+n(c.used_count)+(c.max_uses!=null?' من '+n(c.max_uses):'')+(c.min_order>0?' • أقل طلب '+n(c.min_order):'')+(c.expires_at?' • ينتهي '+new Date(c.expires_at).toLocaleDateString('ar-EG'):'')+'</div></div>'}).join('')||'<div class="empty">مفيش كوبونات. اعمل كود زي WELCOME10 يخصم ١٠٪.</div>')+form+'</div>'}

 kcedit:function(d){ST.ecp=Object.assign({},ST.coupons.filter(function(c){return String(c.id)===d.id})[0]);ST.err='';render()},

  var b={code:code,kind:e.kind,value:v,min_order:+val('k_min')||0,max_uses:val('k_max')===''?null:parseInt(val('k_max')),expires_at:val('k_exp')?new Date(val('k_exp')+'T23:59:59').toISOString():null,once_per_customer:!!$('#k_once').checked,active:!!$('#k_act').checked};

 if(t.getAttribute('data-a')==='xmenu'&&ev.target!==t)return;if(/^close/.test(t.getAttribute('data-a'))&&ev.target!==t)return;var d={};for(var i=0;i<t.attributes.length;i++){var a=t.attributes[i];if(a.name.indexOf('data-')===0)d[a.name.slice(5)]=a.value}var f=A[d.a];if(f)f(d,ev)});
